services:
  storage:
    # Fork comunitario di MinIO. Dopo il primo avvio funzionante, fissa un tag preciso.
    image: pgsty/minio:latest
    container_name: palmr-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: palmr-admin
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?imposta S3_SECRET_KEY nel file .env}
      MINIO_API_CORS_ALLOW_ORIGIN: https://palmr.domain.it
    ports:
      - "127.0.0.1:9000:9000" # API S3: deve essere raggiungibile dal browser (URL firmati)
    volumes:
      - storage_data:/data
      # Per usare un disco/cartella tua: - /percorso/tuo/disco:/data
    restart: unless-stopped

  palmr:
    build: .
    image: palmr:local
    container_name: palmr
    environment:
      ENABLE_S3: "true"
      S3_ENDPOINT: https://s3.domain.it
      #S3_PORT: "9000"
      SECURE_SITE: "true"
      S3_USE_SSL: "true"
      S3_ACCESS_KEY: palmr-admin
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: palmr-files
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_AUTO_CREATE_BUCKET: "true"

    ports:
      - "127.0.0.1:5487:5487"
    volumes:
      - palmr_data:/app/server
    depends_on:
      - storage
    restart: unless-stopped

volumes:
  palmr_data:
    name: palmr_data
  storage_data:

networks:
  default:
    external: true
    name: npm_proxy
