services:
  storage:
    image: pgsty/minio:latest
    container_name: palmr-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: palmr-admin
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:? S3_SECRET_KEY in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: https://palmr.yourdomain.it # URL of Palmr Web interface
    ports:
      - "127.0.0.1:9000:9000" # Internal storage (S3, REQUIRED for file uploads when using internal storage)
    volumes:
      - storage_data:/data
      # ==============================================================================
      # ADVANCED: Use a different disk for file storage (for larger capacity)
      # ==============================================================================
      # Uncomment the line below to store files on a different disk:
      # - /path/to/your/large/disk:/app/server/data
      #
      # Example: Mount a 2TB drive for files while keeping database on fast SSD
      # - /mnt/storage/palmr-files:/app/server/data
      #
    restart: unless-stopped

  palmr:
    image: ghcr.io/m4th12/palmrclaude:latest
    container_name: palmr
    environment:
      ENABLE_S3: "true"
      S3_ENDPOINT: https://s3.yourdomain.it # Your S3 endpoint
      #S3_PORT: "9000"
      SECURE_SITE: "true" # Set true if using HTTPS reverse proxy (optional)
      S3_USE_SSL: "true"
      S3_ACCESS_KEY: palmr-admin
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: palmr-files
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_AUTO_CREATE_BUCKET: "true"

    ports:
      - "127.0.0.1:5487:5487"
    volumes:
      - palmr_data:/app/server
    depends_on:
      - storage
    restart: unless-stopped

volumes:
  palmr_data:
    name: palmr_data
  storage_data:
